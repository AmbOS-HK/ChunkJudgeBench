[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chunkjudgebench"
dynamic = ["version"]
description = "Benchmark Chinese text chunking strategies under a fixed BM25 bigram retriever."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AmbOS-HK", email = "support@ambos.cn" }]
keywords = ["chunking", "rag", "retrieval", "benchmark", "chinese", "bm25"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.optional-dependencies]
fetch = ["requests>=2.31,<3"]
tiktoken = ["tiktoken>=0.7"]
dev = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/AmbOS-HK/ChunkJudgeBench"
Issues = "https://github.com/AmbOS-HK/ChunkJudgeBench/issues"

[project.scripts]
chunkjudgebench = "chinese_chunk.cli:main"

[tool.setuptools]
packages = ["chinese_chunk"]
include-package-data = false

[tool.setuptools.dynamic]
version = { attr = "chinese_chunk.__version__" }
