name: Bug 报告
description: 报告可复现的错误（切片结果、指标、脚本异常）
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先确认这是**可复现的错误**，不是评测结论的争议（那走 Feature/讨论）。
        安全漏洞请勿在此提交，见 SECURITY.md。
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: '用 python -c "import chinese_chunk; print(chinese_chunk.__version__)" 输出，或 commit hash'
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 操作系统、Python 版本、是否装了 tiktoken
      placeholder: Windows 11 / Python 3.13.18 / 未装 tiktoken
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 完整命令，不要只写「跑评测就报错」
      placeholder: |
        python scripts/fetch_corpus.py
        python -m chinese_chunk.cli eval --sizes 600
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 贴关键输出或堆栈，不要贴整屏日志
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 是否只在特定文档/策略/尺寸下出现
    validations:
      required: false
